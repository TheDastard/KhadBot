[project]
name = "khadbot"
version = "0.1.0"
description = "KhadBot — Agentic WoW Assistant"
requires-python = ">=3.12,<3.15"
dependencies = [
    # Core: what local ingest, digest and the analyst need. Everything else is an optional group below, so
    # `uv sync --no-dev --extra cli` runs the local pipeline.

    # --- LangChain / agent framework ---
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",      # base runnables, tools, message types
    "langchain-anthropic>=0.3.0", # Claude Sonnet provider
    "langgraph>=0.2.0",           # graph orchestration; used in production phase

    # --- Data validation ---
    "pydantic>=2.12.0",           # tool argument schemas + config models

    # --- Prompt template ---
    "jinja2",                     # agent prompt templates: base, guardrails, persona

    # --- HTTP client ---
    "httpx>=0.27.0",              # async HTTP for the WarcraftLogs client

    # --- Encounter review ---
    "polars>=1.20",               # event store frames (parquet)
    "orjson>=3.10",               # fast JSON for raw WCL pages and event hashing
    "pyyaml>=6.0",                # agent / encounter / registry config files
    "python-dotenv>=1.0.0",       # load .env (imported by agent/coach.py)
]

[project.optional-dependencies]
cli = [
    # --- CLI ---
    "rich>=13.7.0",               # terminal rendering: panels, tables, live tool panel, markdown output
    "prompt_toolkit>=3.0.0",      # REPL input: history, async prompt, keyboard handling
]

api = [
    # --- Dashboard API ---
    "fastapi>=0.143.3",           # read-only dashboard API (src/khadbot/api/), OpenAPI contract
    "uvicorn>=0.54.0",            # ASGI server for `main.py serve`
]

hosted = [
    # --- Hosted mode: Postgres and object storage ---
    "psycopg[binary]>=3.3.6",     # PostgreSQL driver; the binary extra avoids needing libpq on the host
    "psycopg-pool>=3.3.3",        # connection pool for the hosted findings store and migrations
    "boto3>=1.43.115",            # S3-compatible object storage client (Cloudflare R2, MinIO) for hosted blobs
    "zstandard>=0.25.0",          # zstd for the raw WCL pages in hosted object storage
]

providers = [
    # --- Non-Anthropic LLM providers (llm_factory imports each only when it is selected) ---
    "langchain-openai>=0.2.0",    # OpenAI provider
    "langchain-groq>=1.1.2",      # Groq provider (fast free-tier inference)
    "langchain-ollama>=1.0.1",    # Ollama provider (local models)
]

dev = [
    # --- Every optional group, so a dev environment runs the whole app and its tests ---
    "khadbot[cli,api,hosted,providers]",

    # --- Core test runner ---
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",   # async support for LangChain async calls
    "pytest-mock>=3.14.0",      # cleaner mocker fixture over raw unittest.mock
    "pytest-cov>=5.0.0",        # coverage reporting; run with --cov=src

    # --- HTTP mocking ---
    "respx>=0.21.0",            # async-native HTTP mocking for httpx
    "moto[s3]>=5.2.4",          # in-memory S3 for the S3 blob store unit tests

    # --- Linting / formatting ---
    "ruff>=0.4.0",              # fast linter + formatter; replaces flake8 + black
    "mypy>=1.10.0",             # static type checking

    # --- LangSmith ---
    "langsmith>=0.1.0",         # trace URL construction, eval dataset management

    # --- Local dev convenience ---
    "ipython>=8.0.0",           # nicer REPL for debugging agent traces
    "pre-commit>=4.5.0",        # pre-commit hooks
    "types-pyyaml>=6.0.0",      # mypy stubs for yaml

    # --- Architecture ---
    "import-linter>=2.15",      # layer rule: lint-imports in mise run check
]

[project.scripts]
khadbot = "khadbot.main:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
# The migration runner reads these at run time, so a built wheel must carry them.
"khadbot.db" = ["migrations/*.sql"]

[tool.uv]
# uv owns the Python version (.python-version) and .venv; mise only pins Node and pnpm and runs tasks.
required-version = ">=0.13"

[tool.pytest.ini_options]
# Auto-mode means you don't need @pytest.mark.asyncio on every async test.
# Many LangChain components are async.
asyncio_mode = "auto"

# Where pytest looks for tests
testpaths = ["tests"]

# Coverage: measure src/, report missing lines, also write HTML report
addopts = """
    --cov=src
    --cov-report=term-missing
    --cov-report=html:htmlcov
    -v"""

# Markers: `perf` and `eval` tests are skipped unless selected with `-m perf` / `-m eval` (see tests/conftest.py)
markers = [
    "perf: timing/memory budget tests; run with -m perf",
    "eval: golden-question evals against a real LLM; run with -m eval",
    "hosted: needs Postgres (DATABASE_URL) or S3 settings (KHADBOT_S3_BUCKET); skipped without them, run by the CI hosted job",
]

# Treat these warnings as errors so they don't silently mask issues
filterwarnings = [
    "error::DeprecationWarning",
    "error::PendingDeprecationWarning",
    # Suppress known Pydantic v1 UserWarnings from langchain_core internals
    "ignore::UserWarning:pydantic",
    "ignore::UserWarning:langchain_core",
    # langchain_core's callback manager calls asyncio.iscoroutinefunction, deprecated in Python 3.14
    "ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning:langchain_core",
    # starlette's TestClient (FastAPI) warns that it will move from httpx to httpx2; httpx is what the repo uses
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:UserWarning",
]

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = [
    "__pycache__",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "I",    # isort
]
ignore = [
    "E501", # line-too-long (handled by formatter)
    "W191", # tab-indentation
    "E111", # indentation-not-multiple-of-four
    "E114", # indentation-not-multiple-of-four-comment
    "E117", # over-indented
]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.isort]
known-first-party = ["khadbot"]
section-order = [
    "future",
    "standard-library",
    "third-party",
    "first-party",
    "local-folder",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

# Layer rule: each layer imports only the layers below it. Layers are listed top to bottom; `|` marks siblings that
# must not import each other, `:` siblings that may. Entry points sit on top, then services, the composition root,
# the Postgres adapters, the encounter engine, the integrations, and the foundation.
[tool.importlinter]
root_package = "khadbot"

[[tool.importlinter.contracts]]
name = "Python layers"
type = "layers"
containers = ["khadbot"]
layers = [
    "main",
    "api | cli",
    "jobs | agent",
    "wiring",
    "db",
    "encounter",
    "wcl | simc",
    "config : errors : storage : llm_factory",
]
