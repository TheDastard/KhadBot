# Local hosted-mode stack: Postgres, SeaweedFS (S3-compatible storage), a migrate step, the API and a worker, all reading
# deploy/stack.env. Run it with `mise run stack:up`; see deploy/README.md and docs/hosting/.
#
# The native dev loop (`mise run dev:all`) starts only the postgres and seaweedfs services from this file and runs the
# API and worker on the host; the bucket and migrations are done by scripts/dev/dev.py, so it builds no image.
#
# Everything listens on 127.0.0.1 only. The stack stores its data in named volumes, never in a host directory: the
# local .khadbot_data directory is not mounted and plays no part here.
#
# The opt-in "obs" profile adds Loki, Alloy and Grafana for searching logs (docs/hosting/observability.md).

name: khadbot

x-khadbot: &khadbot
  # The build context is the repository root; .dockerignore keeps .env and local data out of it.
  build:
    context: ..
    dockerfile: deploy/Dockerfile
    args:
      # The commit, written as `version` on every log line; CI sets it, a local build leaves it empty.
      GIT_SHA: ${GIT_SHA:-}
  image: khadbot:local
  env_file: stack.env
  restart: "no"

services:
  postgres:
    image: postgres:17
    env_file: stack.env
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  # SeaweedFS in one container (master, volume server, filer and S3 gateway) as the local S3 store; production uses
  # Cloudflare R2. The S3 identity is written from the same two variables KhadBot's boto3 client reads.
  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    env_file: stack.env
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mkdir -p /etc/seaweedfs
        printf '{"identities":[{"name":"khadbot","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","List","Tagging","Write"]}]}' "$${AWS_ACCESS_KEY_ID}" "$${AWS_SECRET_ACCESS_KEY}" > /etc/seaweedfs/config.json
        exec weed server -dir=/data -s3 -s3.config /etc/seaweedfs/config.json
    ports:
      - "127.0.0.1:8333:8333"
    volumes:
      - seaweedfsdata:/data

  # Creates the bucket named by KHADBOT_S3_BUCKET once the S3 gateway answers, then exits. It uses the KhadBot image
  # and boto3, so it needs no SeaweedFS tooling.
  createbucket:
    <<: *khadbot
    entrypoint: ["python", "-c"]
    command:
      - |
        import os, time
        from khadbot.storage.s3 import make_client
        client = make_client(endpoint_url=os.environ["KHADBOT_S3_ENDPOINT"], region=os.environ["KHADBOT_S3_REGION"])
        bucket = os.environ["KHADBOT_S3_BUCKET"]
        deadline = time.monotonic() + 120
        while True:
            try:
                client.create_bucket(Bucket=bucket)
                break
            except Exception as exc:
                code = getattr(exc, "response", {}).get("Error", {}).get("Code", "")
                if code in ("BucketAlreadyOwnedByYou", "BucketAlreadyExists"):
                    break
                if time.monotonic() > deadline:
                    raise
                time.sleep(1)
        print("bucket ready:", bucket)
    depends_on:
      - seaweedfs

  # Applies the database migrations, then exits. The API and the worker start after it succeeds.
  migrate:
    <<: *khadbot
    command: ["migrate"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *khadbot
    command: ["api"]
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      createbucket:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 12

  # The job queue worker: takes ingest, process and review jobs (KHADBOT_WORKER_QUEUES) from the same Postgres the API
  # writes them to. It needs no WCL credentials until a job fetches from WCL; stack.env holds none.
  worker:
    <<: *khadbot
    command: ["worker"]
    healthcheck:
      test: ["CMD", "khadbot", "worker", "--check"]  # the worker touches a health file while its loop runs
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3
    depends_on:
      migrate:
        condition: service_completed_successfully
      createbucket:
        condition: service_completed_successfully

  # Queues a job and checks the running worker finishes it (scripts/dev/queue_smoke.py), then exits.
  # Run with `mise run stack:queue-smoke`.
  queue-smoke:
    <<: *khadbot
    entrypoint: ["python", "scripts/dev/queue_smoke.py"]
    profiles: ["smoke"]
    depends_on:
      - worker

  # Loads the recorded fixture reports through the pipeline into the stack (offline: no WCL calls). The fixtures and
  # the helper they need are mounted read-only from the repository. Run with `mise run stack:seed`. The seed runs the
  # job functions directly, not through the queue: SYNTH01 needs its own filters, encounter file and registries,
  # which a worker built from the configuration does not have.
  seed:
    <<: *khadbot
    entrypoint: ["python", "scripts/data/seed_stack.py"]
    profiles: ["seed"]
    volumes:
      - ../tests/fixtures:/app/tests/fixtures:ro
      - ../tests/helpers:/app/tests/helpers:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      createbucket:
        condition: service_completed_successfully

  # ---- Observability (profile "obs"; `mise run obs:up`, docs/hosting/observability.md) --------------------------------
  # Opt-in: plain `stack:up` and the CI stack job start none of these. obs:up starts them with --no-deps beside a
  # running stack (stack:up) or the dev loop's Postgres (dev:infra).

  loki:
    image: grafana/loki:3.7.9
    profiles: ["obs"]
    command: ["-config.file=/etc/loki/config.yaml"]
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./observability/loki/config.yaml:/etc/loki/config.yaml:ro
      - lokidata:/loki

  # Reads the khadbot project's container logs through the Docker socket and the dev loop's .khadbot_dev_logs files.
  alloy:
    image: grafana/alloy:v1.21.3
    profiles: ["obs"]
    command: ["run", "--server.http.listen-addr=0.0.0.0:12345", "--storage.path=/var/lib/alloy/data", "/etc/alloy/config.alloy"]
    ports:
      - "127.0.0.1:12345:12345"
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ../.khadbot_dev_logs:/devlogs:ro
      - alloydata:/var/lib/alloy/data
    depends_on:
      - loki

  # Anonymous users are Admin: acceptable only because the port is bound to 127.0.0.1. The admin password in
  # stack.env is for the HTTP API.
  grafana:
    image: grafana/grafana:13.3.0
    profiles: ["obs"]
    env_file: stack.env
    environment:
      GF_SERVER_HTTP_PORT: "3001"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    depends_on:
      - loki

  # Creates or updates the khadbot_readonly role Grafana's Postgres data source uses, then exits. Needs the migrated
  # tables: in the full stack it waits for migrate; obs:up runs it after stack:up or dev:infra.
  obs-readonly:
    image: postgres:17
    profiles: ["obs"]
    env_file: stack.env
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        PGPASSWORD="$${POSTGRES_PASSWORD}" exec psql -h postgres -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" \
          -v ON_ERROR_STOP=1 -v ro_password="$${KHADBOT_READONLY_PASSWORD}" -v db="$${POSTGRES_DB}" \
          -f /readonly.sql
    volumes:
      - ./observability/postgres/readonly.sql:/readonly.sql:ro
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
  seaweedfsdata:
  lokidata:
  alloydata:
  grafanadata:
