# Defensive cooldowns.
#
# Player cooldowns that keep players alive, which the encounter digest tracks: damage reduction,
# absorbs, immunities and healing cooldowns, plus Innervate until a utility file exists (Power Infusion
# is in offensive_cooldowns.yaml). Damage-window coverage and death-window defensives read only this
# file. Spell IDs, names, `target`, `cooldown_s` and
# `duration_s` come from game client data (SimC tables for WoW build 12.1.5.70448) via the review file
# of scripts/build_registries.py; Aura Mastery, which the data can't classify, was ported from the old
# MAJOR_COOLDOWN_IDS list. Cooldowns and durations are base values before talents. Every entry is
# unverified until a person checks it in game; analysis lists used, unverified cooldowns as digest
# anomalies.
#
# target: personal (only the caster), external (one chosen ally), raid (an area or the whole raid).
#
# `aura_spell_ids` lists the spells a cooldown's aura is applied under when they differ from the
# cast; the Buffs filter fetches them and their intervals count as the cooldown.
#
# Entries are sorted by class, then name.
