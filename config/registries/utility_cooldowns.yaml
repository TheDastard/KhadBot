# Utility cooldowns.
#
# Player cooldowns that help allies move, cast or come back, or that control enemies: speed (Stampeding
# Roar), mana (Evocation), root and snare immunity (Spirit Walk), moving an ally (Leap of Faith), and
# stuns, incapacitates, knockbacks, grips, roots and slows (Capacitor Totem, Ring of Peace). Nothing in
# encounter mode reads this file yet. Spell IDs, names, `target`, `role`, `cooldown_s` and `duration_s`
# come from game client data (SimC tables for WoW build 12.1.5.70448) via the review file of
# scripts/build_registries.py, with a 30 s cooldown floor. Cooldowns and durations are base values before
# talents. Every entry is unverified until a person checks it in game.
#
# Three roles were set by hand because SimC's tables drop the effect that decides them: Blind's
# disorient and Intimidating Shout's fear (the data shows only their slow and root), and Gorefiend's
# Grasp, whose pull the data marks only with the knockback mechanic. Damage cooldowns that show up for a
# side effect (The Hunt's stun, Frozen Orb's slow, Avenging Crusader's speed) are left out, and so is
# every spell already in defensive_cooldowns.yaml or offensive_cooldowns.yaml (Dispersion, Avatar).
# Innervate moved here from defensive_cooldowns.yaml (role mana), since it keeps no one alive. Battle
# resurrections, Mana Tide Totem, Symbol of Hope, Wind Rush Totem and Time Spiral are missing because the
# tables don't show what they do.
#
# target: personal (only the caster), external (one chosen ally), raid (an area or the whole raid),
# enemy (one chosen enemy), enemies (an area or a cone of enemies).
# role: movement, mana, resurrect, freedom (root and snare immunity), reposition (moves an ally), stun,
# incapacitate, knockback, grip, root, slow.
#
# `aura_spell_ids` lists the spells a cooldown's aura is applied under when they differ from the cast. No
# spell ID, cast or aura, may also be in defensive_cooldowns.yaml or offensive_cooldowns.yaml. An aura
# names one entry, so Intimidation's stun (1258508) sits on the Beast Mastery and Survival cast (19577)
# and not on the Marksmanship one (474421).
#
# Entries are sorted by class, then name.
