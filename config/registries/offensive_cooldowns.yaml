# Offensive cooldowns.
#
# Player cooldowns that raise damage done, which the encounter digest tracks next to the defensive
# ones: haste, damage and stat buffs on the caster, one ally or the raid (Bloodlust, Avenging Wrath,
# Power Infusion). Damage-window coverage and death-window defensives never read this file. Spell IDs,
# names, `target`, `cooldown_s` and `duration_s` come from game client data (SimC tables for WoW build
# 12.1.5.70448) via the review file of scripts/data/build_registries.py. Cooldowns the heuristic can't
# classify take their values from their own spell data: Pillar of Frost and Dark Transformation (45 s
# cooldowns, under the generator's 60 s minimum), and Breath of Sindragosa, Convoke the Spirits, Zenith
# and the three warlock summons, whose effects are scripted. Summon Infernal's duration is null because
# its spell lasts only for the cast. Each of those was cast in the recorded raid nights.
#
# Exceptions to the data: Metamorphosis is listed under 200166, the cast recorded logs show, rather than
# its player spell 191427, which the logs never show. Bestial Wrath's and Dark Transformation's target
# is personal because the unit their auras name is the pet. Enhancement's Ascendance (114051) has no
# aura_spell_ids: the aura the data finds for it, 466772, belongs to Doom Winds, which it triggers.
#
# Cooldowns and durations are base values before talents. Every entry is unverified until a person
# checks it in game; analysis lists used, unverified cooldowns as digest anomalies.
#
# target: personal (only the caster), external (one chosen ally), raid (an area or the whole raid).
#
# `aura_spell_ids` lists the spells a cooldown's aura is applied under when they differ from the
# cast. No spell ID, cast or aura, may also be in defensive_cooldowns.yaml.
#
# Entries are sorted by class, then name.
