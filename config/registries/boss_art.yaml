# Art references for raid bosses, one entry per boss, by WCL encounter ID (docs/game-art.md).
#
# Raids only. Loaded by khadbot.api.boss_art.load_boss_art; a malformed file stops the caller at load.
# Not in the encounter files: search results show bosses that have no encounter file, and encounter files feed the
# analysis cache keys.
#
# Fields:
#   encounter_id          WCL's encounter ID.
#   name                  The boss's name as WCL spells it; documentation only.
#   journal_encounter_id  Blizzard's Dungeon Journal encounter ID; null when no journal instance lists the boss.
#   portrait              The file name after `UI-EJ-BOSS-` in the client export of ENCOUNTERJOURNAL, with no
#                         extension; null when the export has none. Stored as art/portraits/<portrait>.png.
#   kill_achievement_id   The boss's `Mythic: <boss>` achievement, whose icon is the boss thumbnail; null if unknown.
#   verified              true only when a person has confirmed every non-null value on the entry against the game
#                         (the Adventure Guide for the journal ID and portrait, the achievement list for the
#                         achievement). false means at least one value is a name match from Blizzard's API that
#                         nobody has checked. A null is "unknown or none", never a guess.
