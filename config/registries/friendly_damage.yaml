# Friendly-damage registry.
#
# Abilities on the player's side whose damage lands on players. Digests leave this damage out of the
# unregistered share, count it by class, and report self-inflicted damage per player and in death windows.
# Entries are matched by ability ID whatever the damage row's source.
#
# class: what the damage is
#   redistribution  damage shared out from other players (charged to no one)
#   delayed_boss    boss damage taken later instead of at once, such as a share of a hit taken as a DoT
#                   (charged to no one)
#   self_inflicted  a cost the player chose to pay (reported per player)
#   involuntary     self-damage the player can't control, such as a trinket proc (charged to no one)
#
# origin: where the ability comes from
#   class           a class spell or talent; the comment after the entry names the class
#   borrowed_power  an expansion-wide system power
#   item            a trinket, embellishment or other gear effect; players may keep one past its season
#   null            not known
#
# Entries are grouped by class, then by origin within each class. Ability IDs come from the damage rows of the
# recorded Heroic nights (H7z1fqDXjRTFnbtg, QkVa6GHRK8yfrTbw, trMgApZCVYkv3jdq), or from game client data (the
# friendly-damage review file of scripts/build_registries.py) for abilities those nights don't show; their
# class is a proposal from what the ability does. verified: false marks an entry nobody has confirmed yet. `/digest <fight> --unregistered` lists friendly-source abilities still missing
# from this file.
abilities:
