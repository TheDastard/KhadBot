# Ula'tek, final boss of The Venomous Abyss.
# Open gaps for this file are tracked under "Ula'tek" in
# docs/encounter/follow-ups/venomous-abyss.md.
#
# Ability IDs are the ones WarcraftLogs records, which are often not the spell IDs guides link to.
# Entries list the difficulties they have been checked on; add a difficulty only after checking the
# entry against logs from it. Heroic was checked on the three nights in docs/encounter/recorded-nights.md
# (47 pulls); Normal on 1DaN32nvrTFZKBqx fights 34-41 (8 pulls, kill 41; 34-36 are resets under 30 s).
#
# Failures are charged to the player responsible. For most rules that is the player who was hit.
# Mechanics that punish the whole raid for one player's mistake use per_cluster, which counts one
# failure per occurrence and charges it to the player a blame spec points at: the target named by the
# boss's own cast, or the NPC's aggro holder (its latest melee swing or taunt). An occurrence with no such
# player still counts as a failure.
encounter_id: 3492
name: Ula'tek
zone: {id: 53, name: The Venomous Abyss}
file_version: 5

# WarcraftLogs reports phase transitions for this encounter (phase IDs 1-4).
phases:
  - id: p1
    name: "Stage One: Fury of the Serpent Mother"
    difficulties: [heroic, normal]
    start: {trigger: pull}
  - id: p2
    name: "Stage Two: Children of the Doomscale"
    difficulties: [heroic, normal]
    start: {trigger: wcl_phase, phase: 2}
  - id: intermission
    name: "Intermission: The Shattering"
    difficulties: [heroic, normal]
    start: {trigger: wcl_phase, phase: 3}
  - id: p3
    name: "Stage Three: Ula'tek's Ascension"
    difficulties: [heroic, normal]
    start: {trigger: wcl_phase, phase: 4}

mechanics:
  # -- Raid-wide pressure ----------------------------------------------------------------------
  - id: necrotic_vapors
    name: Necrotic Vapors
    verified: false
    description: "Stacking raid-wide damage for the whole fight. It is not counted as a failure."
    difficulties: [heroic, normal]
    ability_ids: [1286835]
    kind: unavoidable
    severity: low

  - id: spectral_coils
    name: Spectral Coils
    verified: false
    description: >-
      Damage every player takes, reduced by the number of players at the impact; the Soul Constrictor debuff
      stops a player reducing the next Coils. A debuffed player who soaks again can't be told apart in the logs,
      so no failure is counted.
    # Damage (1287265), the Spectral Coil and Gore Rattle casts, and the Soul Constrictor debuff (1300685;
    # stops a player reducing the next Coils). Every player takes the damage, reduced by the number of
    # players at the impact, so soak_count_lt never fires. A debuffed player who soaks again can't be told
    # apart: the debuff is never reapplied while active and every player hit takes the same amount.
    difficulties: [heroic]
    ability_ids: [1287265, 1299010, 1308927, 1300685]
    kind: soak
    cluster_window_ms: 3000
    severity: high

  - id: spectral_coils
    name: Spectral Coils
    verified: false
    description: >-
      Damage every player takes, reduced by the number of players at the impact. It is not counted as a
      failure.
    # Normal has the same damage and casts but no Soul Constrictor: 23 Coil casts over the 8 Normal pulls
    # and no 1300685 application. Every player still takes the damage, so soak_count_lt would never fire.
    difficulties: [normal]
    ability_ids: [1287265, 1299010, 1308927]
    kind: soak
    cluster_window_ms: 3000
    severity: high

  - id: mephitic_thrash
    name: Mephitic Thrash
    verified: false
    description: >-
      Tail sweep that players inside it should get out of. The logs give them the same impact and DoT as
      everyone outside, so standing in it is not counted as a failure.
    # Tail sweep. One ID covers the cast, impact, debuff and DoT. Players inside the sweep should get
    # out, but the logs give them the same impact and DoT as everyone outside, so standing in it can't
    # be detected.
    difficulties: [heroic, normal]
    ability_ids: [1296301]
    kind: unavoidable
    cluster_window_ms: 3000
    severity: low

  - id: blight_vein
    name: Blight Vein
    verified: false
    description: >-
      Raid-wide DoT each time a Grasping Fangs tether is broken; tethers must be broken a few at a time. It is
      not counted as a failure.
    # Raid-wide DoT each time a Grasping Fangs tether is broken; tethers must be broken a few at a time.
    difficulties: [heroic]
    ability_ids: [1317955, 1311609]
    kind: unavoidable
    cluster_window_ms: 3000
    severity: medium

  - id: blight_vein
    name: Blight Vein
    verified: false
    description: >-
      Raid-wide DoT each time a Grasping Fangs tether is broken; tethers must be broken a few at a time. It is
      not counted as a failure.
    # Normal records Blight Vein under other IDs: damage 1311602 and a debuff 1311600 that never stacks
    # (10 applications, 50 hits over pulls 39 and 41). Heroic's 1317955 and 1311609 never appear.
    difficulties: [normal]
    ability_ids: [1311602, 1311600]
    kind: unavoidable
    cluster_window_ms: 3000
    severity: medium

  - id: malignant_shell
    name: Malignant Shell
    verified: false
    description: >-
      Eggs stick to the players who carry them and tick while attached. A shell broken by Caustic Waves or
      Deadly Venom that hatches a Blightscale Viper is a failure charged to the carrier; one lost at the
      carrier's death that hatches a Viper is a failure charged to no one.
    # Eggs stick to the players who pick them up and tick while attached: the cost of carrying eggs.
    # A shell (1295360) broken by a Caustic Waves hit (1292403) or a step into the venom pools (Deadly
    # Venom, 1297338) hatches a Blightscale Viper, whose Putrid Membrane (1301268) then lands on the raid.
    # Each such break is charged to the carrier. A shell lost at the carrier's death that hatches a Viper
    # is a failure too, charged to no one: the death is already charged to what killed them, but the Viper
    # adds to its cost.
    difficulties: [heroic, normal]
    ability_ids: [1297213, 1295360]
    kind: unavoidable
    failure:
      rule: aura_removed_by
      ability_ids: [1292403, 1297338]
      followed_by_ids: [1301268]
      on_death: true
    severity: low

  - id: enrage
    name: Fury Unleashed
    verified: false
    description: "Ula'tek's enrage: a large raid hit followed by heavy damage every second."
    # Not reached on Normal (the kill took 302 s), so it stays Heroic-only.
    difficulties: [heroic]
    ability_ids: [1295004, 1286905]
    kind: unavoidable
    severity: high

