  - id: unchecked_rage
    name: Unchecked Rage
    verified: false
    description: >-
      Raid-wide physical damage when Ula'tek has no target in melee and is not casting. Each cast is a failure
      charged to the player holding Ula'tek's aggro, usually a tank who taunted her but never reached melee.
    # Raid-wide physical damage when Ula'tek has no melee target and is not casting. Charged to Ula'tek's
    # (NPC 257758) aggro holder: a tank who taunted it but never reached melee is the one at fault.
    # reach_yd: Ula'tek's swing reach, the p95 of her melee swings' distance to the target rounded up
    # (47 Heroic pulls, target sample at most 1 s old: n=932, p95 20.4 yd, max 30.3 yd).
    # Each cast is its own failure: one cast's hits land within 60 ms, and Ula'tek recasts it 2.4 s or more
    # later while nobody is in melee (21 casts over the 47 pulls). Normal matches: 17 casts over the 8
    # pulls, each cast's hits within 20 ms, recasts 2.1 s or more apart; the blamed holders beyond reach
    # stood 27.8 to 52.3 yd away and those in reach 12.1 to 15.7 yd.
    difficulties: [heroic, normal]
    ability_ids: [1301007]
    kind: avoidable
    failure:
      rule: per_cluster
      blame: {by: aggro_holder, npc_game_id: 257758, ms: 30000, reach_yd: 21}
    cluster_window_ms: 1000
    severity: high

