# Entombed Sentinels, The Venomous Abyss: the Breath of Ula'tek (NPC 258557) and the Blood of Ula'tek
# (NPC 258558), fought 40 yards apart by half the raid each.
# Open gaps for this file are tracked under "Entombed Sentinels" in
# docs/encounter/follow-ups/venomous-abyss.md.
#
# Ability IDs are the ones WarcraftLogs records, which are often not the spell IDs guides link to.
# Entries list the difficulties they have been checked on; add a difficulty only after checking the
# entry against logs from it. Counts in comments are over the 14 Heroic pulls of x9bLZvAHpnm4tWF3
# (fights 17 to 24 and 26 to 31, kill 31). Normal evidence, marked "Normal:", is over 2 Normal kills:
# RzFgvG7xV1AHLXh6 fight 2 and 1DaN32nvrTFZKBqx fight 7.
#
# Failures are charged to the player responsible, which for most rules is the player who was hit.
# soak_count_lt and debuff_stacks_gt charge no one, and so does Noxious Blast's per_cluster rule
# (blame by nobody).
encounter_id: 3445
name: Entombed Sentinels
zone: {id: 53, name: The Venomous Abyss}
file_version: 2

# WarcraftLogs reports phase transitions for this encounter: phase 1 (Stage One: Entombed Sentinels) and
# phase 2 (Intermission: Vitriolic Stasis), alternating. The first intermission starts 46 s into the pull
# and each later one 91 s after the previous one ends. The pull opens in the first stage; the intermission
# and the stage after it then repeat for as long as the pull lasts (the kill had four intermissions, the
# longest wipes five), each repeat its own span under the same phase ID. Normal: the same phase IDs and
# names; the first intermission starts 46.2 to 46.3 s in and each later one 91.0 s after the previous one
# ends. Intermissions last 11 to 21 s; the kills had five (RzFgvG7xV1AHLXh6) and three.
phases:
  - id: p1
    name: "Stage One: Entombed Sentinels"
    difficulties: [heroic, normal]
    start: {trigger: pull}
  - id: intermission
    name: "Intermission: Vitriolic Stasis"
    difficulties: [heroic, normal]
    start: {trigger: wcl_phase, phase: 2}
    repeat: true
  - id: stage
    name: "Stage One: Entombed Sentinels (after an intermission)"
    difficulties: [heroic, normal]
    start: {trigger: wcl_phase, phase: 1}
    repeat: true

mechanics:
  # -- Both Sentinels --------------------------------------------------------------------------
  - id: mark_of_acid
    name: Mark of Acid
    verified: false
    description: >-
      Stacking DoT the Breath of Ula'tek puts on every player within 40 yards every 5 s; stacks drop when the
      groups swap sides at each intermission. It is not counted as a failure.
    # One ID covers the debuff and its damage. The highest stack a player reached in a pull: median 15, 18 on
    # the kill, 22 at most. Normal: median 17, 18 at most.
    difficulties: [heroic, normal]
    ability_ids: [1284500]
    kind: debuff
    severity: medium

  - id: mark_of_blood
    name: Mark of Blood
    verified: false
    description: >-
      The Blood of Ula'tek's stacking DoT on the players near it, working as Mark of Acid does; stacks drop when
      the groups swap sides at each intermission. It is not counted as a failure.
    # Highest stack per player and pull: median 13, 18 on the kill, 21 at most. Normal: median 17, 18 for
    # everyone but one player a kill, who kept the Blood's stacks through the swaps (39 and 45).
    difficulties: [heroic, normal]
    ability_ids: [1284506]
    kind: debuff
    severity: medium

  - id: vitriolic_stasis
    name: Vitriolic Stasis
    verified: false
    description: >-
      Opens each intermission: the Sentinels come together and take 99% less damage. It is not counted as a
      failure.
    # The two casts (Blood 1284588, Breath 1284606) that open each intermission.
    difficulties: [heroic, normal]
    ability_ids: [1284588, 1284606]
    kind: unavoidable
    severity: low

  - id: helical_toxins
    name: Helical Toxins
    verified: false
    description: >-
      Intermission debuff and DoT on every player; colliding with a partner so the two toxins total exactly 4
      removes both. A toxin still on its player 28 s after the Vitriolic Stasis cast becomes Cultivated Burst.
    # Debuff 1284590 and its DoT 1284813. Partners who collide lose the debuff in the same millisecond.
    # Normal: 20 to 24 players an intermission, every pair removed 1.5 to 20.9 s after the cast.
    difficulties: [heroic, normal]
    ability_ids: [1284590, 1284813]
    kind: debuff
    severity: medium

  - id: cultivated_burst
    name: Cultivated Burst
    verified: false
    description: >-
      Explosion on a player whose Helical Toxins was not neutralized, about 28 s after the Vitriolic Stasis
      cast. Every hit is a failure, charged to the player hit.
    # 28.0 to 28.2 s after the cast; 22 hits in 6 pulls, 11 of them killing blows. Not seen on Normal:
    # every toxin there was neutralized well before 28 s.
    difficulties: [heroic]
    ability_ids: [1284941]
    kind: avoidable
    failure: {rule: any_hit}
    severity: high

  - id: cultivated_burst_dot
    name: Cultivated Burst (DoT)
    verified: false
    description: "One-minute DoT on a player who survived Cultivated Burst. It is not counted as a failure."
    # Debuff 1284947 and its damage 1284948. Not seen on Normal (no Cultivated Burst).
    difficulties: [heroic]
    ability_ids: [1284947, 1284948]
    kind: unavoidable
    severity: low

  - id: deadly_venom
    name: Deadly Venom
    verified: false
    description: >-
      Venom around the edge of the room that ticks once a second on players standing in it. Each player hit in
      an occurrence counts one failure, charged to that player.
    # Dealt by the environment; the same ID as on Ula'tek. Normal: one zero-damage tick in the two kills.
    difficulties: [heroic, normal]
    ability_ids: [1297338]
    kind: avoidable
    failure: {rule: hits_per_cluster_gt, value: 0}
    cluster_window_ms: 2000
    severity: medium

  # -- Breath of Ula'tek (green) ---------------------------------------------------------------
  - id: venom_coagulation
    name: Venom Coagulation
    verified: false
    description: >-
      The Breath spawns a Venom Coagulation slime, which pulses Contaminate on the raid until it dies. It is not
      counted as a failure.
    # The Breath's cast that spawns a Venom Coagulation (NPC 260766), and the slime's own Contaminate cast.
    # Its damage is the contaminate damage window. Normal: the same IDs and NPC, 6 and 10 slimes a kill.
    difficulties: [heroic, normal]
    ability_ids: [1284251, 1284257]
    kind: unavoidable
    severity: high

  - id: toxic_droplets
    name: Toxic Droplets
    verified: false
    description: >-
      Droplets the Breath scatters, which players soak by stepping on them, taking a hit each; droplets left
      alone explode as Noxious Blast. No failure is counted: nothing says how many one player may take.
    # Cast (1284434) and the hit a player takes for stepping on a droplet (1284451). A cast makes 26
    # droplets (the most hits any cast produced, and the median), stepped on 2.1 to 16.2 s after it by a
    # median of 13 players. Normal: 21 to 27 hits a cast, 2.1 to 13.0 s after it, by 11 to 16 players.
    difficulties: [heroic, normal]
    ability_ids: [1284434, 1284451]
    kind: soak
    cluster_window_ms: 3000
    severity: medium

  - id: noxious_blast
    name: Noxious Blast
    verified: false
    description: >-
      Raid-wide hit from each Toxic Droplet left alone, about 18 s after the cast. A cast that left any droplet
      is one failure however many exploded, charged to no one because nobody owns a droplet.
    # 18.1 to 19.1 s after the Toxic Droplets cast; 9 failures over the 14 pulls, none on the kill.
    # Normal: 18.3 to 18.8 s after the cast; 4 failures (RzFgvG7xV1AHLXh6) and 2.
    difficulties: [heroic, normal]
    ability_ids: [1284452]
    kind: avoidable
    failure: {rule: per_cluster, blame: {by: nobody}}
    cluster_window_ms: 3000
    severity: high

  - id: living_venom
    name: Living Venom
    verified: false
    description: >-
      Venom that flies from the droplets to the Breath and back out, hitting players in its path. Each player
      hit in an occurrence counts one failure, charged to that player.
    # Most hits land 6 to 12 s after a Toxic Droplets cast. A 5 s window keeps the trip out and back as one
    # occurrence. Not seen on Normal: no Living Venom hit in either kill.
    difficulties: [heroic]
    ability_ids: [1284209]
    kind: avoidable
    failure: {rule: hits_per_cluster_gt, value: 0}
    cluster_window_ms: 5000
    severity: medium

  - id: empowering_slam
    name: Empowering Slam
    verified: false
    description: >-
      Tank hit; each slam on the same target raises the Breath's physical damage until it slams someone else.
      It is not counted as a failure.
    # One ID covers the cast and the damage. The logs hold no aura for the damage bonus. Normal: every 22 s,
    # as on Heroic.
    difficulties: [heroic, normal]
    ability_ids: [1284458]
    kind: unavoidable
    severity: low

  # -- Blood of Ula'tek (red) ------------------------------------------------------------------
  - id: bloodvenom_injection
    name: Bloodvenom Injection
    verified: false
    description: >-
      Tank hit with a stacking debuff and DoT; the tanks swap Sentinels at each intermission, so a tank holds 4
      stacks at most. A fifth stack means a tank kept the Blood through an intermission: one failure, charged
      to no one.
    # Tank hit and cast (1284487), its stacking debuff (1284491) and the debuff's DoT (1310126). The Blood
    # casts it every 22 s, four times between intermissions (4 stacks in every stage of the kill). 2 failures
    # over the 14 pulls. Normal: the same cadence, two casts before the first intermission and 4 stacks
    # at most; no failure.
    difficulties: [heroic, normal]
    ability_ids: [1284487, 1284491, 1310126]
    kind: debuff
    failure: {rule: debuff_stacks_gt, value: 4}
    cluster_window_ms: 3000
    severity: medium

  - id: blighted_blood
    name: Blighted Blood
    verified: false
    description: >-
      Dispellable 18 s DoT on several players. No failure is counted: the guides disagree on how soon to dispel
      it.
    # Cast (1284483) and the DoT (1284471; one ID covers the debuff and its damage). See follow-ups.
    # Normal: 4 or 5 casts a kill, 3 players each.
    difficulties: [heroic, normal]
    ability_ids: [1284483, 1284471]
    kind: dispel
    severity: medium

  - id: blood_venom
    name: Blood Venom
    verified: false
    description: >-
      Pools left where the Blood's debuffs end, ticking about once a second on players inside. A single tick is
      a player crossing a pool; a second tick in one occurrence is a failure, charged to that player.
    # A player inside holds the debuff and takes the ticks; one ID covers both. 922 of the 1,178 debuffs lasted
    # under 1.5 s. Not seen on Normal: no Blood Venom row in either kill.
    difficulties: [heroic]
    ability_ids: [1284210]
    kind: avoidable
    failure: {rule: hits_per_cluster_gt, value: 1}
    cluster_window_ms: 2000
    severity: medium

  - id: unstable_miasma
    name: Unstable Miasma
    verified: false
    description: >-
      A mark on one player erupts 8 s later, its damage split evenly among the players within 7.5 yards; the
      Blood's group soaks it together. An eruption that hits fewer than 8 players is one failure, charged to no
      one.
    # Cast (1288232), the mark on one player (1288260) and the eruption 8.0 s later (1288282): about 4.4M
    # before mitigation split over everyone hit. With 9 or more players (56 of 67 eruptions) each takes under
    # 0.5M and 3 died; with 7 or fewer (9 eruptions) each takes 0.66M or more and 20 died. Normal: 7.7 to
    # 8.1 s after the mark, 2.6M to 3.3M split; 15 of 16 eruptions hit 8 to 14 players, and the one that hit 4
    # killed 3 of them.
    difficulties: [heroic, normal]
    ability_ids: [1288232, 1288260, 1288282]
    kind: soak
    failure: {rule: soak_count_lt, value: 8}
    cluster_window_ms: 2000
    severity: high

  - id: clinging_murk
    name: Clinging Murk
    verified: false
    description: >-
      Short stacking DoT the Unstable Miasma eruption spreads among the players it hit. It is not counted as a
      failure.
    # Debuff 1288297 and its damage 1303097. Normal: the same IDs, 3 stacks at most.
    difficulties: [heroic, normal]
    ability_ids: [1288297, 1303097]
    kind: debuff
    cluster_window_ms: 3000
    severity: low

damage_windows:
  - id: contaminate
    name: Contaminate
    # Raid-wide pulse every 3 s from a Venom Coagulation until the slime dies; a 4 s window keeps one
    # slime's pulses as one occurrence. expected_defensive_cooldowns is a guess (see its follow-ups).
    # Normal: the same 3 s pulse.
    difficulties: [heroic, normal]
    ability_ids: [1284258]
    cluster_window_ms: 4000
    expected_defensive_cooldowns: 1

ignored_abilities:
  - {ability_id: 1, name: Melee, difficulties: [heroic, normal]}         # the Sentinels on their tanks
