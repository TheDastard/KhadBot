# The Coiled Altar (Zul'jan and Hex Lord Malacrass), seventh boss of The Venomous Abyss.
# Open gaps for this file are tracked under "The Coiled Altar" in
# docs/encounter/follow-ups/venomous-abyss.md.
#
# Ability IDs are the ones WarcraftLogs records, which are often not the spell IDs guides link to.
# Entries list the difficulties they have been checked on; add a difficulty only after checking the
# entry against logs from it. Counts in comments are over 35 Heroic pulls (one kill) from four reports;
# "Normal:" counts are over 13 Normal pulls (one kill) from reports 6xHBTkhGXbL3CdMD (fights 22-25 and
# 27-32) and 1DaN32nvrTFZKBqx (fights 31-33), of which 9 reach Stage Two and 3 Stage Three.
#
# Failures are charged to the player responsible, for most rules the player who was hit. Soak, interrupt
# and stack rules count one failure per occurrence and charge no one.
encounter_id: 3429
name: The Coiled Altar
zone: {id: 53, name: The Venomous Abyss}
file_version: 2

# WarcraftLogs reports phase transitions for this encounter (phase IDs 1-4). Stage Two starts when Zul'jan
# (NPC 257911) falls, the intermission when Hex Lord Malacrass (NPC 259854) does.
phases:
  - id: p1
    name: "Stage One: Serpent's Bargain"
    difficulties: [heroic, normal]
    start: {trigger: pull}
  - id: p2
    name: "Stage Two: Usurper's Reprisal"
    difficulties: [heroic, normal]
    start: {trigger: wcl_phase, phase: 2}
  - id: intermission
    name: "Intermission: The Claimed Vessel"
    difficulties: [heroic, normal]
    start: {trigger: wcl_phase, phase: 3}
  - id: p3
    name: "Stage Three: Coiled Union"
    difficulties: [heroic, normal]
    start: {trigger: wcl_phase, phase: 4}

