# mise.toml — KhadBot tool versions and tasks. Run `mise tasks` to list them, `mise run <task>` to run one.
#
# Python and .venv belong to uv (.python-version, pyproject.toml, uv.lock): never add python to [tools] or turn on
# _.python.venv. Every task is one plain command, with env vars in `env`, so it runs the same from cmd, PowerShell
# and Git Bash. Variants of one task share a `group:` prefix (`test:unit`), and `mise run "group:*"` runs them all.
#
# Tool pins, tasks and task `env` work in an untrusted checkout, so new worktrees need no `mise trust`. Keep it that
# way: top-level [env], hooks and env-file sourcing would make every worktree need trusting first.

# ── Tools ───────────────────────────────────────────────────────────────────
[tools]
node = "24"
pnpm = "12"


# ── Environment ─────────────────────────────────────────────────────────────
# First-time setup is scripts/dev/setup.ps1, which runs `install`. After that, `uv run` keeps .venv in sync with uv.lock,
# so these are rarely needed by hand; the variants give a lighter environment.
[tasks.install]
description = "Install runtime, CLI and dev dependencies into .venv"
run = "uv sync --extra dev"

[tasks."install:runtime"]
description = "Install runtime dependencies only"
run = "uv sync --no-dev"

[tasks."install:cli"]
description = "Install runtime and CLI dependencies (rich, prompt_toolkit)"
run = "uv sync --no-dev --extra cli"


# ── Run ─────────────────────────────────────────────────────────────────────
[tasks.cli]
description = "Launch the interactive CLI"
run = "uv run python main.py cli"


# ── Testing ─────────────────────────────────────────────────────────────────
[tasks.check]
description = "Lint, typecheck, layer rule and unit tests: the gate for every commit"
run = ["uv run ruff check src tests scripts", "uv run mypy src", "uv run lint-imports", "uv run pytest tests/unit"]

[tasks.test]
description = "Run all tests"
run = "uv run pytest tests"

[tasks."test:unit"]
description = "Unit tests only (no LLM inference, no network)"
run = "uv run pytest tests/unit"

# Defaults to Ollama; override with LLM_PROVIDER=groq.
[tasks."test:integ"]
description = "Integration tests; needs Ollama (default) or LLM_PROVIDER=groq"
env = { LLM_PROVIDER = "{{ get_env(name='LLM_PROVIDER', default='ollama') }}" }
run = "uv run pytest tests/integration"

# Expensive: run deliberately, never in CI. Requires ANTHROPIC_API_KEY; LANGSMITH_API_KEY adds per-question
# feedback to the traces. Gate with KHADBOT_EVAL_MIN_PASS_RATE (0-1); unset reports the pass rate only.
[tasks."test:eval"]
description = "Golden evals against Anthropic; costs money"
env = { LLM_PROVIDER = "anthropic", LANGCHAIN_TRACING_V2 = "true" }
run = "uv run pytest tests/eval -m eval -s --no-cov"


# ── Code quality ────────────────────────────────────────────────────────────
[tasks.lint]
description = "Lint with ruff (read-only)"
run = "uv run ruff check src tests scripts"

# Writes files; run lint separately for a read-only check.
[tasks.format]
description = "Format and auto-fix with ruff (writes files)"
run = ["uv run ruff format src tests scripts", "uv run ruff check --fix src tests scripts"]

[tasks.typecheck]
description = "Type-check with mypy"
run = "uv run mypy src"

[tasks."lint:imports"]
description = "Check the Python layer rule with import-linter"
run = "uv run lint-imports"


# ── Dashboard API ───────────────────────────────────────────────────────────
[tasks.serve]
description = "Dashboard API on 127.0.0.1:8000; reads KHADBOT_DATA_DIR"
run = "uv run python main.py serve"


# ── Database (hosted mode) ───────────────────────────────────────────────
[tasks."db:migrate"]
description = "Apply database migrations to DATABASE_URL (hosted mode)"
run = "uv run python main.py migrate"


# ── Local hosted stack (needs Docker; deploy/README.md) ─────────────────────
[tasks."stack:up"]
description = "Build the image and start the local hosted stack: Postgres, SeaweedFS, migrate, API (127.0.0.1:8000)"
run = "docker compose -f deploy/compose.yaml up --build --detach"

[tasks."stack:seed"]
description = "Load the recorded fixture reports into the running stack (offline; no WCL calls)"
run = "docker compose -f deploy/compose.yaml --profile seed run --rm seed"

[tasks."stack:smoke"]
description = "Check the running, seeded stack: health, report list and a night summary"
run = "uv run python scripts/dev/stack_smoke.py"

[tasks."stack:queue-smoke"]
description = "Queue a job on the running stack and check the worker finishes it"
run = "docker compose -f deploy/compose.yaml --profile smoke run --rm queue-smoke"

[tasks."stack:logs"]
description = "Follow the stack's logs"
run = "docker compose -f deploy/compose.yaml logs --follow --tail 100"

[tasks."stack:down"]
description = "Stop the stack and keep its data volumes"
run = "docker compose -f deploy/compose.yaml --profile seed --profile smoke down"

[tasks."stack:reset"]
description = "Stop the stack and delete its data volumes (database and bucket)"
run = "docker compose -f deploy/compose.yaml --profile seed --profile smoke down --volumes"


# ── Generated files ─────────────────────────────────────────────────────────
[tasks."gen:contracts"]
description = "Regenerate contracts/openapi.json from the API"
run = "uv run python scripts/dev/gen_contracts.py"

[tasks."gen:fixture-data"]
description = "Build .khadbot_fixture_data from the recorded fixtures (offline)"
run = "uv run python scripts/data/build_fixture_data.py --out .khadbot_fixture_data"


# ── Cleanup ─────────────────────────────────────────────────────────────────
[tasks.clean]
description = "Remove caches and build output (keeps .venv, .env and .khadbot_data/)"
run = "powershell -NoProfile -ExecutionPolicy Bypass -File scripts/dev/clean.ps1"

# Stops processes running from the venv (e.g. ruff.exe held open by the editor), then retries the delete.
[tasks."clean:all"]
description = "clean, then delete .venv (stops processes holding it open)"
depends = ["clean"]
run = "powershell -NoProfile -ExecutionPolicy Bypass -File scripts/dev/distclean.ps1 -Venv .venv"
