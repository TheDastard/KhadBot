# mise.toml — KhadBot tool versions and tasks. Run `mise tasks` to list them, `mise run <task>` to run one.
#
# Python and .venv belong to uv (.python-version, pyproject.toml, uv.lock): never add python to [tools] or turn on
# _.python.venv. Every task is one plain command, with env vars in `env`, so it runs the same from cmd, PowerShell
# and Git Bash. Variants of one task share a `group:` prefix (`test:unit`), and `mise run "group:*"` runs them all.
#
# Tool pins, tasks and task `env` work in an untrusted checkout, so new worktrees need no `mise trust`. Keep it that
# way: top-level [env], hooks and env-file sourcing would make every worktree need trusting first.

# ── Tools ───────────────────────────────────────────────────────────────────
[tools]
node = "24"
pnpm = "12"


# ── Environment ─────────────────────────────────────────────────────────────
# First-time setup is scripts/dev/setup.ps1, which runs `install`. After that, `uv run` keeps .venv in sync with uv.lock,
# so these are rarely needed by hand; the variants give a lighter environment.
[tasks.install]
description = "Install runtime, CLI and dev dependencies into .venv"
run = "uv sync --extra dev"

[tasks."install:runtime"]
description = "Install runtime dependencies only"
run = "uv sync --no-dev"

[tasks."install:cli"]
description = "Install runtime and CLI dependencies (rich, prompt_toolkit)"
run = "uv sync --no-dev --extra cli"

[tasks."install:web"]
description = "Install the TypeScript workspace's packages (apps/, packages/) from pnpm-lock.yaml"
run = "pnpm install --frozen-lockfile"

[tasks."install:playwright"]
description = "Download Playwright's Chromium for the end-to-end tests (a large download)"
run = "pnpm --filter @khadbot/web exec playwright install chromium"


# ── Run ─────────────────────────────────────────────────────────────────────
[tasks.cli]
description = "Launch the interactive CLI"
run = "uv run python main.py cli"


# ── Testing ─────────────────────────────────────────────────────────────────
[tasks.check]
description = "Lint, typecheck, layer rule and unit tests: the gate for every commit"
run = ["uv run ruff check src tests scripts", "uv run mypy src", "uv run lint-imports", "uv run pytest tests/unit"]

[tasks."check:web"]
description = "The TypeScript workspace's gate: generated-client drift check, lint, typecheck and Vitest"
run = "pnpm run check"

[tasks."check:all"]
description = "check, then check:web: the gate for a commit that touches both sides"
run = ["mise run check", "mise run check:web"]

[tasks.test]
description = "Run all tests"
run = "uv run pytest tests"

[tasks."test:unit"]
description = "Unit tests only (no LLM inference, no network)"
run = "uv run pytest tests/unit"

[tasks."test:web"]
description = "Vitest across the TypeScript workspace"
run = "pnpm -r run test"

# Needs the dev loop running (mise run dev:all) with SYNTH01 seeded; docs/hosting/local.md, "The web app".
[tasks."test:e2e"]
description = "Playwright against the dev loop's hosted API (WCL replay, test sessions); see docs/hosting/"
run = "pnpm --filter @khadbot/web e2e"

# Starts main.py serve on 8001 and a web dev server on 3000 itself; needs .khadbot_fixture_data (gen:fixture-data).
[tasks."test:e2e:local"]
description = "Playwright smoke test against main.py serve over the fixture data (sign-in off)"
run = "pnpm --filter @khadbot/web e2e:local"

# Defaults to Ollama; override with LLM_PROVIDER=groq.
[tasks."test:integ"]
description = "Integration tests; needs Ollama (default) or LLM_PROVIDER=groq"
env = { LLM_PROVIDER = "{{ get_env(name='LLM_PROVIDER', default='ollama') }}" }
run = "uv run pytest tests/integration"

# Expensive: run deliberately, never in CI. Requires ANTHROPIC_API_KEY; LANGSMITH_API_KEY adds per-question
# feedback to the traces. Gate with KHADBOT_EVAL_MIN_PASS_RATE (0-1); unset reports the pass rate only.
[tasks."test:eval"]
description = "Golden evals against Anthropic; costs money"
env = { LLM_PROVIDER = "anthropic", LANGCHAIN_TRACING_V2 = "true" }
run = "uv run pytest tests/eval -m eval -s --no-cov"


# ── Code quality ────────────────────────────────────────────────────────────
[tasks.lint]
description = "Lint with ruff (read-only)"
run = "uv run ruff check src tests scripts"

# Writes files; run lint separately for a read-only check.
[tasks.format]
description = "Format and auto-fix with ruff (writes files)"
run = ["uv run ruff format src tests scripts", "uv run ruff check --fix src tests scripts"]

[tasks.typecheck]
description = "Type-check with mypy"
run = "uv run mypy src"

[tasks."lint:imports"]
description = "Check the Python layer rule with import-linter"
run = "uv run lint-imports"

[tasks."lint:commits"]
description = "Check this branch's commit messages against the commit rules and the tag registry"
run = "uv run python scripts/dev/check_commit_msg.py --range refs/remotes/origin/main..HEAD"

[tasks."lint:tags"]
description = "List the commit tags and sub-tags (scripts/dev/commit_tags.yaml)"
run = "uv run python scripts/dev/check_commit_msg.py --tags"

# Names only: neither task reads out or prints a value. .env is the main checkout's; deploy/dev.env this checkout's.
[tasks."env:check"]
description = "Compare .env and deploy/dev.env with their committed examples, by variable name"
run = "uv run python scripts/dev/check_env.py"

[tasks."env:fix"]
description = "Append the names .env and deploy/dev.env lack from their examples, commented out"
run = "uv run python scripts/dev/check_env.py --fix"


# ── Web app (apps/web; .claude/rules/web.md) ────────────────────────────────
# NEXT_PUBLIC_API_BASE picks the API; this task defaults it to the dev loop's. `dev:all` starts the same server.
[tasks."web:dev"]
description = "Next.js dev server on localhost:3000 (NEXT_PUBLIC_API_BASE, default http://localhost:8000)"
env = { NEXT_PUBLIC_API_BASE = "{{ get_env(name='NEXT_PUBLIC_API_BASE', default='http://localhost:8000') }}" }
run = "pnpm --filter @khadbot/web dev"


# ── Dashboard API ───────────────────────────────────────────────────────────
[tasks.serve]
description = "Dashboard API on 127.0.0.1:8000; reads KHADBOT_DATA_DIR"
run = "uv run python main.py serve"


# Local mode, a quick look at a data directory: read routes only, no sign-in, Postgres, bucket or Docker. Build the data directory once with
# `mise run gen:fixture-data`. To serve your own data instead, set KHADBOT_DATA_DIR before running the task.
[tasks."serve:fixtures"]
description = "Local-mode API on 127.0.0.1:8000 over .khadbot_fixture_data (or KHADBOT_DATA_DIR); see docs/hosting/"
env = { KHADBOT_DATA_DIR = "{{ get_env(name='KHADBOT_DATA_DIR', default='.khadbot_fixture_data') }}" }
run = "uv run python main.py serve"


# ── Database (hosted mode) ───────────────────────────────────────────────
[tasks."db:migrate"]
description = "Apply database migrations to DATABASE_URL (hosted mode)"
run = "uv run python main.py migrate"


# ── Local hosted stack (needs Docker; deploy/README.md) ─────────────────────
[tasks."stack:up"]
description = "Build the image and start the local hosted stack: Postgres, SeaweedFS, migrate, API (127.0.0.1:8000)"
run = "docker compose -f deploy/compose.yaml up --build --detach"

[tasks."stack:seed"]
description = "Load the recorded fixture reports into the running stack (offline; no WCL calls)"
run = "docker compose -f deploy/compose.yaml --profile seed run --rm seed"

[tasks."stack:smoke"]
description = "Check the running, seeded stack: health, report list and a night summary"
run = "uv run python scripts/dev/stack_smoke.py"

[tasks."stack:queue-smoke"]
description = "Queue a job on the running stack and check the worker finishes it"
run = "docker compose -f deploy/compose.yaml --profile smoke run --rm queue-smoke"

[tasks."stack:logs"]
description = "Follow the stack's logs"
run = "docker compose -f deploy/compose.yaml logs --follow --tail 100"

[tasks."stack:down"]
description = "Stop the stack and keep its data volumes"
run = "docker compose -f deploy/compose.yaml --profile seed --profile smoke down"

[tasks."stack:reset"]
description = "Stop the stack and delete its data volumes (database and bucket)"
run = "docker compose -f deploy/compose.yaml --profile seed --profile smoke down --volumes"


# -- Native dev loop (needs Docker for Postgres and SeaweedFS; docs/hosting/local.md, "Local development") --
# Postgres and SeaweedFS run in Docker; the hosted API and worker run natively and restart when Python files change.
# Settings come from deploy/dev.env (setup.ps1 creates it from deploy/dev.env.example). Port 8000 is shared with
# stack:up: run one of them at a time.
[tasks."dev:infra"]
description = "Start Postgres and SeaweedFS in Docker, create the bucket and apply migrations"
run = "uv run python scripts/dev/dev.py infra"

[tasks."dev:api"]
description = "Hosted API on 127.0.0.1:8000, native, restarting on Python changes (run dev:infra first)"
run = "uv run python scripts/dev/dev.py api"

[tasks."dev:worker"]
description = "Job worker, native, restarting on Python changes (run dev:infra first)"
run = "uv run python scripts/dev/dev.py worker"

[tasks."dev:seed"]
description = "Load the recorded fixture reports into the dev loop's database and bucket; pass --only CODE after --"
run = "uv run python scripts/dev/dev.py seed"

[tasks."dev:smoke"]
description = "Check the running dev loop: health, a night summary and a queued job the worker finishes"
run = "uv run python scripts/dev/dev.py smoke"

[tasks."dev:web"]
description = "Web dev server on localhost:3000 against the dev loop's API (localhost:8000)"
run = "uv run python scripts/dev/dev.py web"

[tasks."dev:all"]
description = "dev:infra, then the API, the worker and the web dev server together (--no-web leaves it out); Ctrl-C stops them"
run = "uv run python scripts/dev/dev.py all"

# ── Test sessions (development only) ────────────────────────────────────────
# Runs `main.py test-session` with the dev loop's environment (deploy/dev.env, which turns KHADBOT_TEST_SESSIONS on);
# it refuses otherwise. Arguments go after `--`: `mise run dev:session -- --user alice --reports CODE`.
[tasks."dev:session"]
description = "Start a session for a named test user and print its cookie (development only; see docs/hosting/)"
run = "uv run python scripts/dev/dev.py session"



# ── Generated files ─────────────────────────────────────────────────────────
[tasks."gen:contracts"]
description = "Regenerate contracts/openapi.json from the API"
run = "uv run python scripts/dev/gen_contracts.py"

[tasks."gen:types"]
description = "Regenerate packages/api-client's types from contracts/openapi.json (after gen:contracts)"
run = "pnpm --filter @khadbot/api-client gen"

[tasks."gen:fixture-data"]
description = "Build .khadbot_fixture_data from the recorded fixtures: offline ingest and digest, no network"
run = "uv run python scripts/data/build_fixture_data.py --out .khadbot_fixture_data"


# ── Cleanup ─────────────────────────────────────────────────────────────────
[tasks.clean]
description = "Remove Python caches and the web app's build and test output (keeps .venv, node_modules, .env and .khadbot_data/)"
run = "powershell -NoProfile -ExecutionPolicy Bypass -File scripts/dev/clean.ps1"

# Stops processes running from the venv (e.g. ruff.exe held open by the editor), then retries the delete.
[tasks."clean:all"]
description = "clean, then delete .venv (stops processes holding it open)"
run = "powershell -NoProfile -ExecutionPolicy Bypass -File scripts/dev/clean.ps1 -Venv"

# Back to a fresh clone's state, apart from .env, deploy/dev.env and .khadbot_data/; reinstall with setup.ps1.
[tasks."clean:deps"]
description = "clean, then delete .venv, every node_modules and .khadbot_fixture_data"
run = "powershell -NoProfile -ExecutionPolicy Bypass -File scripts/dev/clean.ps1 -All"
