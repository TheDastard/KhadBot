# Lint, typecheck and unit tests.
#
# The real WCL fixtures live in Git LFS (about 200 MB) and GitHub's free tier allows 1 GB of LFS bandwidth a
# month, so the `check` job never downloads them: the tests that need them see pointer files and skip. The
# `real-fixtures` job downloads them and only runs when started by hand from the Actions tab.
#
# uv reads the Python version from .python-version and owns .venv. mise only runs the tasks here; it installs no
# tools because this job doesn't need Node.
#
# The WarcraftLogs credentials are placeholders. Config requires them to be set, and unit tests never call WCL;
# locally they come from .env, which load_dotenv finds by walking up from the source tree.

name: check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  WARCRAFTLOGS_CLIENT_ID: ci-placeholder
  WARCRAFTLOGS_CLIENT_SECRET: ci-placeholder

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    if: github.event_name != 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      GIT_LFS_SKIP_SMUDGE: "1"
      # Don't install Node and pnpm when a task runs.
      MISE_TASK_RUN_AUTO_INSTALL: "false"
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
      # setup-uv publishes no major-version tags, so it is pinned to a full release.
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - uses: jdx/mise-action@v5
        with:
          install: false
      - run: uv sync --locked --extra dev
      - run: mise run check

  # Tests that need Postgres (the `hosted` marker). They skip without DATABASE_URL, so the `check` job above
  # runs them as skips; this job gives them a real database. The major version is pinned in docs/decisions.md.
  hosted:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: khadbot
          POSTGRES_PASSWORD: ci-placeholder
          POSTGRES_DB: khadbot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U khadbot -d khadbot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      GIT_LFS_SKIP_SMUDGE: "1"
      DATABASE_URL: postgresql://khadbot:ci-placeholder@localhost:5432/khadbot
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - run: uv sync --locked --extra dev
      - run: uv run pytest tests/integration/hosted -m hosted --no-cov

  # A core-plus-cli install, with none of the api, hosted or providers groups: the local pipeline must run on it.
  # The smoke script imports khadbot.main, ingests the recorded synthetic report offline and prints a digest.
  core:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      GIT_LFS_SKIP_SMUDGE: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - run: uv sync --locked --no-dev --extra cli
      - run: uv run --no-sync python -c "import khadbot.main"
      - run: uv run --no-sync python scripts/dev/core_smoke.py

  # Builds the container image (nothing is pushed), starts the compose stack from it, seeds the synthetic fixture
  # report offline and checks the API: health, the report list and a night summary. The stack's env file holds
  # throwaway local values; no WCL credentials are involved.
  stack:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      GIT_LFS_SKIP_SMUDGE: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
      - run: docker compose -f deploy/compose.yaml up --build --detach
      - run: docker image ls khadbot:local
      - run: docker compose -f deploy/compose.yaml --profile seed run --rm seed --only SYNTH01
      - run: python3 scripts/dev/stack_smoke.py
      # Queues a job on the stack and waits for the worker container to finish it.
      - run: docker compose -f deploy/compose.yaml --profile smoke run --rm queue-smoke
      - if: failure()
        run: docker compose -f deploy/compose.yaml --profile seed --profile smoke logs --no-color --tail 200
      - if: always()
        run: docker compose -f deploy/compose.yaml --profile seed --profile smoke down --volumes

  real-fixtures:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - run: uv sync --locked --extra dev
      - run: uv run pytest tests/unit -m "not perf"
