# Recorded WarcraftLogs pages are byte-for-byte API output (and stored in Git LFS); never rewrite them.
exclude: ^tests/fixtures/encounter/wcl/(?!SYNTH01/)[^/]+/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace # trim unnecessary whitespace
        args: [--markdown-linebreak-ext=md] # keep Markdown's two-space line breaks
      - id: end-of-file-fixer   # ensure files end with a newline
      - id: check-yaml          # validates syntax of yaml files
        exclude: ^pnpm-lock\.yaml$ # generated by pnpm, which writes it as several YAML documents
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.9
    hooks:
      - id: ruff-check  # linter
        args: [--fix]
      - id: ruff-format # formatter
