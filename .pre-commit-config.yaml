# Recorded WarcraftLogs pages are byte-for-byte API output (and stored in Git LFS); never rewrite them.
exclude: ^tests/fixtures/encounter/wcl/(?!SYNTH01/)[^/]+/

# `pre-commit install` installs both hooks. Hooks that name no stage run only before the commit, not on its message.
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]

repos:
  # Checks the commit message against .claude/rules/git-commits.md and the tags in scripts/dev/commit_tags.yaml.
  # It runs in pre-commit's own environment, so it works from any shell; keep the PyYAML pin in step with uv.lock.
  - repo: local
    hooks:
      - id: commit-msg
        name: commit message format and tags
        language: python
        additional_dependencies: [pyyaml==6.0.3]
        entry: python scripts/dev/check_commit_msg.py
        stages: [commit-msg]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace # trim unnecessary whitespace
        args: [--markdown-linebreak-ext=md] # keep Markdown's two-space line breaks
      - id: end-of-file-fixer   # ensure files end with a newline
      - id: check-yaml          # validates syntax of yaml files
        exclude: ^pnpm-lock\.yaml$ # generated by pnpm, which writes it as several YAML documents
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.9
    hooks:
      - id: ruff-check  # linter
        args: [--fix]
      - id: ruff-format # formatter
